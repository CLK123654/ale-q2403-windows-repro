name: q2403-windows-repro

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: reference
        type: choice
        options:
          - reference
          - verify

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/windows-host.json
      - name: Generate Reference candidate
        if: ${{ inputs.mode == 'reference' }}
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,'qa')); generate_reference
      - name: Copy Reference evidence
        if: ${{ inputs.mode == 'reference' }}
        shell: pwsh
        run: Copy-Item reference-candidate.zip evidence/reference-candidate.zip
      - name: Verify attachment hashes
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: python qa/verify_hashes.py
      - name: Block MATLAB outbound network
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $matlab = (Get-Command matlab).Source
          New-NetFirewallRule -DisplayName ALE-Q2403-MATLAB-OUT -Direction Outbound -Program $matlab -Action Block | Out-Null
      - name: Execute official MATLAB workflow
        if: ${{ inputs.mode == 'verify' }}
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,'qa')); verify_q2403
      - name: Remove firewall rule
        if: always()
        shell: pwsh
        run: Remove-NetFirewallRule -DisplayName ALE-Q2403-MATLAB-OUT -ErrorAction SilentlyContinue
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2403-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
